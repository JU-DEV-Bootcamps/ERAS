# Dedicated local-testing stack for native Docker inside WSL (no Docker Desktop).
# Run with:  docker compose -f docker-compose.local.yml up -d --build
#
# Networking model:
# - backend uses host networking so it reaches Postgres/Keycloak via localhost (the WSL VM),
#   and so the JWT issuer (http://localhost:18080) matches what the host browser uses.
# - frontend (nginx) serves the SPA and proxies /api → backend (host.docker.internal:8080),
#   keeping API calls same-origin to avoid the app's CORS limitation.
services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES}
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --verbose --import-realm
    environment:
      - KC_HEALTH_ENABLED=true
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    ports:
      - "18080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./Keycloak/:/opt/keycloak/data/import

  backend:
    restart: unless-stopped
    build:
      context: ./ERAS-BE
      dockerfile: ./src/Eras.Api/Dockerfile
    network_mode: host
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - POSTGRES_HOST=localhost
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - KEYCLOAK_BASE_URL=http://localhost:18080
      - KEYCLOAK_REALM=ERAS
      - Keycloak__Audience=api-client
    volumes:
      - ./backend-logs:/app/Logs
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./ERAS-FE
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

volumes:
  postgres_data:
  keycloak_data:
