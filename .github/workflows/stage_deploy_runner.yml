name: Deploy process on runner

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment'
        required: true
        default: 'develop'
        type: choice
        options: [staging, develop, testing, production]

concurrency:
  group: eras-deploy
  cancel-in-progress: false

jobs:
  Set_and_Deploy_submodules:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ github.event.inputs.environment }}
    outputs:
      versions: ${{ steps.versions.outputs.versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Paso 1: if mínimo para publicar suffix, env_name y branch
      - name: Compute suffix, env_name and branch
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.environment }}" in
            develop)
              echo "suffix=DEV"        >> "$GITHUB_OUTPUT"
              echo "env_name=dev"  >> "$GITHUB_OUTPUT"
              echo "branch=${{vars.ERAS_DEV_BRANCH || 'develop'}}" >> "$GITHUB_OUTPUT"
              ;;
            staging|stagging)  # normaliza 'stagging' a 'stage'
              echo "suffix=STAGE"      >> "$GITHUB_OUTPUT"
              echo "env_name=stage"    >> "$GITHUB_OUTPUT"
              echo "branch=main"       >> "$GITHUB_OUTPUT"
              ;;
            testing)
              echo "suffix=TEST"       >> "$GITHUB_OUTPUT"
              echo "env_name=dev"  >> "$GITHUB_OUTPUT"
              echo "branch=develop"    >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "suffix=PROD"       >> "$GITHUB_OUTPUT"
              echo "env_name=production" >> "$GITHUB_OUTPUT"
              echo "branch=${{ vars.ERAS_RELEASE_BRANCH || 'main' }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Invalid environment"; exit 1;
              ;;
          esac

      # Paso 2: lookup dinámico con vars[format(...)] y export a $GITHUB_ENV
      - name: Export generic env vars for selected environment
        shell: bash
        run: |
          set -euo pipefail
          echo "SELECTED_ENV=${{ steps.setup.outputs.env_name }}" >> "$GITHUB_ENV"
          echo "ENV_SUFFIX=${{ steps.setup.outputs.suffix }}"     >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=${{ steps.setup.outputs.branch }}"  >> "$GITHUB_ENV"

          # Solo resuelve el ambiente seleccionado
          echo "COSMIC_API_URL=${{ vars[format('ERAS_{0}_COSMIC_API_URL', steps.setup.outputs.suffix)] }}"     >> "$GITHUB_ENV"
          echo "API_URL=${{        vars[format('ERAS_{0}_API_URL',            steps.setup.outputs.suffix)] }}" >> "$GITHUB_ENV"
          echo "KEYCLOAK_URL=${{   vars[format('ERAS_{0}_KEYCLOAK_URL',       steps.setup.outputs.suffix)] }}" >> "$GITHUB_ENV"
          echo "KEYCLOAK_REALM=${{   vars[format('ERAS_{0}_KEYCLOAK_REALM',       steps.setup.outputs.suffix)] }}" >> "$GITHUB_ENV"
          echo "URL=${{            vars[format('ERAS_{0}_WEB_URL',            steps.setup.outputs.suffix)] }}" >> "$GITHUB_ENV"
          echo "HOST=${{           vars[format('ERAS_{0}_HOST',               steps.setup.outputs.suffix)] }}" >> "$GITHUB_ENV"
          echo "DOCKER_HUB_USER=${{vars[format('ERAS_{0}_DOCKERHUB_USERNAME', steps.setup.outputs.suffix)] }}" >> "$GITHUB_ENV"
          echo "ERAS_CLIENT=${{    vars[format('ERAS_{0}_KEYCLOAK_CLIENT_ID',          steps.setup.outputs.suffix)] }}" >> "$GITHUB_ENV"
          echo "ERAS_CLIENT_FE=${{ vars[format('ERAS_{0}_KEYCLOAK_CLIENT_ID_FE',       steps.setup.outputs.suffix)] }}" >> "$GITHUB_ENV"
          echo "KC_ROLES_RESOURCE=${{ vars[format('ERAS_{0}_KEYCLOAK_ROLES_RESOURCE', steps.setup.outputs.suffix)] || 'eras' }}" >> "$GITHUB_ENV"
          echo "KC_ROLE_ADMINISTRATOR=${{ vars[format('ERAS_{0}_KEYCLOAK_ROLE_ADMINISTRATOR', steps.setup.outputs.suffix)] || 'admin' }}" >> "$GITHUB_ENV"
          echo "KC_ROLE_OFFICER=${{ vars[format('ERAS_{0}_KEYCLOAK_ROLE_OFFICER', steps.setup.outputs.suffix)] || 'Student Services Officer' }}" >> "$GITHUB_ENV"
          echo "KC_ROLE_PROFESSIONAL=${{ vars[format('ERAS_{0}_KEYCLOAK_ROLE_PROFESSIONAL', steps.setup.outputs.suffix)] || 'Professional' }}" >> "$GITHUB_ENV"

      - name: Verify (non-secret) variables
        shell: bash
        run: |
          echo "Env: $SELECTED_ENV (suffix=$ENV_SUFFIX)"
          echo "Target branch: $TARGET_BRANCH"
          # Ejemplo de uso (evita loguear secretos):
          
      - name: Build the BE image through its workflow
        id: build_be
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg ref "$TARGET_BRANCH" \
            --arg cosmic_api_url "$COSMIC_API_URL" \
            --arg keycloak_url "$KEYCLOAK_URL" \
            --arg keycloak_realm "$KEYCLOAK_REALM" \
            --arg keycloak_client_id "$ERAS_CLIENT" \
            --arg keycloak_roles_resource "$KC_ROLES_RESOURCE" \
            --arg keycloak_role_administrator "$KC_ROLE_ADMINISTRATOR" \
            --arg keycloak_role_officer "$KC_ROLE_OFFICER" \
            --arg keycloak_role_professional "$KC_ROLE_PROFESSIONAL" \
            --arg environment_tag "$SELECTED_ENV" \
            '{ref: $ref, inputs: {branch: $ref, cosmic_api_url: $cosmic_api_url, db_host: "database", keycloak_url: $keycloak_url, keycloak_realm: $keycloak_realm, keycloak_client_id: $keycloak_client_id, keycloak_roles_resource: $keycloak_roles_resource, keycloak_role_administrator: $keycloak_role_administrator, keycloak_role_officer: $keycloak_role_officer, keycloak_role_professional: $keycloak_role_professional, environment_tag: $environment_tag}}')
          bash deploy/dispatch-workflow-and-wait.sh JU-DEV-Bootcamps/ERAS-BE RW-test-package-BE-Runner.yml "$payload" be_tag.txt
          echo "tag=$(cat be_tag.txt)" >> "$GITHUB_OUTPUT"

      - name: Build the FE image through its workflow
        id: build_fe
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg ref "$TARGET_BRANCH" \
            --arg api_url "$API_URL" \
            --arg keycloak_url "$KEYCLOAK_URL" \
            --arg keycloak_realm "$KEYCLOAK_REALM" \
            --arg client_id "$ERAS_CLIENT_FE" \
            --arg web_url "$URL" \
            --arg dockerhub_username "$DOCKER_HUB_USER" \
            --arg environment_tag "$SELECTED_ENV" \
            '{ref: $ref, inputs: {branch: $ref, api_url: $api_url, keycloak_url: $keycloak_url, keycloak_realm: $keycloak_realm, client_id: $client_id, web_url: $web_url, dockerhub_username: $dockerhub_username, environment_tag: $environment_tag}}')
          bash deploy/dispatch-workflow-and-wait.sh JU-DEV-Bootcamps/ERAS-FE RW-test-package-FE-Runner.yml "$payload" fe_tag.txt
          echo "tag=$(cat fe_tag.txt)" >> "$GITHUB_OUTPUT"

      - name: Combine the image tags
        id: versions
        env:
          BE_TAG: ${{ steps.build_be.outputs.tag }}
          FE_TAG: ${{ steps.build_fe.outputs.tag }}
        run: |
          set -euo pipefail
          for tag in "$BE_TAG" "$FE_TAG"; do
            if ! [[ "$tag" =~ ^[0-9a-f]{7,40}-[A-Za-z0-9._]+$ ]]; then
              echo "Unexpected image tag '$tag'" >&2
              exit 1
            fi
          done
          echo "versions=$(jq -cn --arg fe "$FE_TAG" --arg be "$BE_TAG" '{"ERAS-FE": $fe, "ERAS-BE": $be}')" >> "$GITHUB_OUTPUT"

      - name: Send the environment
        id: send-env
        run: |
          echo "selected_env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT

          

  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    needs: [Set_and_Deploy_submodules]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setear variable de entorno seleccionada
        id: send-env
        run: |
          echo "selected_env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT

      - name: Usar variable en otro paso
        run: |
          echo "El ambiente seleccionado es: ${{ steps.send-env.outputs.selected_env }}"
      
      - name: Setear SSH para develop
        if: ${{ steps.send-env.outputs.selected_env == 'develop' }}
        env:
          SSH_KEY: ${{ secrets.ERAS_DEV_SSH_KEY }}
          SSH_HOST: ${{ vars.ERAS_DEV_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV

      - name: Setear SSH para staging
        if: ${{ steps.send-env.outputs.selected_env == 'staging' }}
        env:
          SSH_KEY: ${{ secrets.ERAS_STAGE_SSH_KEY }}
          SSH_HOST: ${{ vars.ERAS_STAGE_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV

      - name: Setear SSH para testing
        if: ${{ steps.send-env.outputs.selected_env == 'testing' }}
        env:
          SSH_KEY: ${{ secrets.ERAS_TEST_SSH_KEY }}
          SSH_HOST: ${{ vars.ERAS_TEST_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV
      
      - name: Setear SSH para production
        if: ${{ steps.send-env.outputs.selected_env == 'production' }}
        env:
          SSH_KEY: ${{ secrets.ERAS_PROD_SSH_KEY }}
          SSH_HOST: ${{ vars.ERAS_PROD_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV
          
      - name: Write versions.json
        env:
          VERSIONS: ${{ needs.Set_and_Deploy_submodules.outputs.versions }}
        run: printf '%s\n' "$VERSIONS" > versions.json

      - name: Copy or replace the required files to the target machine
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/id_rsa -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6"
          for file in versions.json deploy/setVersions.sh deploy/containers.sh; do
            for attempt in 1 2 3; do
              scp $SSH_OPTS "$file" ubuntu@${{ env.SSH_HOST }}:~/deploy/ && break
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 5
            done
          done

      - name: Copy the user manuals to the target machine
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/id_rsa -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6"
          ssh $SSH_OPTS ubuntu@${{ env.SSH_HOST }} 'mkdir -p ~/eras-manuals'
          scp -r $SSH_OPTS manuals/. ubuntu@${{ env.SSH_HOST }}:~/eras-manuals/

      - name: Connect and Run Commands
        run: |
          ssh -i ~/.ssh/id_rsa -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 ubuntu@${{ env.SSH_HOST }} << 'EOF'
            set -euo pipefail
            mkdir -p ~/deploy
            echo '${{ needs.Set_and_Deploy_submodules.outputs.versions }}' > ~/deploy/versions.json
            test -f ~/deploy/versions.json || (echo "versions.json not found" && exit 1)
            sed -i 's/\r$//' ~/deploy/setVersions.sh
            sed -i 's/\r$//' ~/deploy/containers.sh
            bash ~/deploy/setVersions.sh
            bash ~/deploy/containers.sh
          EOF
