# Production nginx config for the ERAS frontend container.
#
# Lives on the production host at /home/ubuntu/ssl-certificates/nginx.conf and is
# mounted by deploy/compose.prod.yml as /etc/nginx/conf.d/default.conf.
# After changing it on the host:  cd ~/app && docker compose restart frontend
# (a restart, not a reload: editing a single bind-mounted file can leave the
# container looking at the old inode).
#
# What it does beyond serving the SPA:
# - /api/ is proxied to the backend container, so the browser only ever talks to
#   the site's own origin (no CORS, and the backend's self-signed cert is never
#   shown to users). Cloudflare, which fronts the site, does not forward :5001.
# - /auth/realms/jalasoft/ is proxied to Keycloak for the XHR endpoints (token,
#   refresh, account). The ERAS-PROD client's "Web origins" has a trailing slash,
#   so Keycloak sends no CORS header to the browser. Login/logout stay as plain
#   browser redirects to the real Keycloak.
# - No host-based redirects: the Host header nginx receives behind Cloudflare is
#   not guaranteed to be the one the user typed, and redirecting on it looped.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/eras.crt;
    ssl_certificate_key /etc/nginx/ssl/eras.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;
    resolver 127.0.0.11 valid=300s ipv6=off;
    add_header Content-Security-Policy "frame-ancestors 'self' https://login.jala.systems" always;

    # API on the same origin -> backend container (Kestrel HTTPS on 443)
    location /api/ {
        proxy_pass https://backend:443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Login and logout: browser navigation to the real Keycloak
    location ~ ^/auth/realms/jalasoft/protocol/openid-connect/(auth|logout|registrations)$ {
        return 302 https://login.jala.systems$request_uri;
    }

    # Token, refresh and account: requested by nginx, not by the browser (no CORS)
    location /auth/realms/jalasoft/ {
        set $kc_upstream https://login.jala.systems;
        proxy_pass $kc_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host login.jala.systems;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }

    location / {
        try_files $uri $uri/ /index.html;

        sub_filter_types application/javascript text/javascript;
        sub_filter_once off;

        # The 06-2026 build has the API URL baked in. Not needed once the frontend
        # is built with ERAS_PROD_API_URL=https://eras.jala.edu; harmless if left.
        sub_filter 'https://200.106.245.220:5001' '';

        # Point keycloak-js at the /auth proxy above. Remove this line and the two
        # /auth/ locations once Web origins is fixed on the ERAS-PROD client.
        sub_filter 'https://login.jala.systems/auth' '/auth';

        # Cache-buster: Cloudflare and browsers cache the hashed .js files for 4h.
        # Bump the number whenever the sub_filter rules above change.
        sub_filter '.js"' '.js?v=2"';

        # Keycloak only accepts https://eras.jala.edu/ as redirect URI, so move
        # users who came in through eras.jala.university (done in the browser).
        sub_filter '</head>' '<script>if(location.hostname==="eras.jala.university"){location.replace("https://eras.jala.edu"+location.pathname+location.search+location.hash)}</script></head>';
    }
}
