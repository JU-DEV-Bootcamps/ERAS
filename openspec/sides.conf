# The SDD sides (ADR-0011). A side is a submodule whose tests prove an Acceptance Criterion; its name is what a
# spec writes on a scenario's **Side:** line (several joined with " + ", for example "BE + FE + FE-React").
# The check scripts, the /sdd-* skills and AGENTS.md read the sides from this file and never name one by hand.
# Adding a client is one [section] here plus that client's own AGENTS.md (ADR-0007); removing one is deleting it.
#
# One [section] per side, then "key = value" lines. Lines starting with # are comments.
#   submodule    folder of the git submodule, from the repository root
#   tests        folder of the tests, inside the submodule
#   include      test file name patterns, separated by spaces
#   key          how a test carries its AC key <change-id>/AC-<n>:
#                  trait = an xUnit attribute [Trait("AC", "<key>")]
#                  title = the it() title starts with [<key>]
#   skip         extended regular expression of a focused or skipped test, searched in the files that carry a key
#   group        parity group: sides in the same group are clients of the same product (check-parity.sh)
#   clean        folders inside the submodule deleted before the gates run (generated output)
#   gate.<name>  one gate of AGENTS.md section 8.7, run inside the submodule, in the order of this file
#   coverage     minimum line coverage (%) read with reportgenerator from the Cobertura files after gate.test passes

[BE]
submodule = ERAS-BE
tests = test
include = *.cs
key = trait
skip = \[(Fact|Theory)\(Skip
clean = TestResults CoverletReport
gate.build = dotnet build Eras.sln -warnaserror
gate.format = dotnet format Eras.sln --verify-no-changes
gate.test = dotnet test Eras.sln --collect:"XPlat Code Coverage" --results-directory ./TestResults --settings coverlet.runsettings
coverage = 25

[FE]
submodule = ERAS-FE
tests = src/app
include = *.spec.ts
key = title
skip = (^|[^A-Za-z_])(fit|xit|fdescribe|xdescribe)\(
group = web
gate.lint = npm run lint
gate.test = npm test -- --watch=false --browsers=ChromeHeadless --code-coverage
gate.build = npm run build

# The commands behind these npm scripts (eslint, vitest run --coverage with its 15% threshold, tsc --noEmit,
# vite build) live in ERAS-FE-React/package.json, so that repository owns them.
[FE-React]
submodule = ERAS-FE-React
tests = src
include = *.test.ts *.test.tsx
key = title
skip = (^|[^A-Za-z_.])(fit|xit|fdescribe|xdescribe)\(|\.(only|skip)\(
group = web
gate.lint = npm run lint
gate.test = npm run test:ci
gate.typecheck = npm run typecheck
gate.build = npm run build
